name: mudita_player
description: "Minimalist music player for Mudita Kompakt"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # Audio playback
  just_audio: ^0.9.40
  audio_session: ^0.1.21

  # Audio metadata read/write
  audiotags: ^1.3.1

  # Database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # File / storage access
  permission_handler: ^11.3.1
  file_picker: ^8.1.2

  # UI helpers
  flutter_displaymode: ^0.6.0
  cached_network_image: ^3.4.1
  flutter_colorpicker: ^1.1.0
  reorderables: ^0.6.0
  palette_generator: ^0.3.3+4
  http: ^1.2.2

  # Utility
  collection: ^1.18.0
  rxdart: ^0.28.0
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.2

  crypto: ^3.0.5
  sqlite3: ^2.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.7
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  assets:
    - assets/
